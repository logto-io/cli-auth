<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(ellipse at top, #1e1b4b 0%, #0f172a 50%, #020617 100%);
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 24px;
        padding: 48px 40px;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        animation: slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes slide-up {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .icon {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        font-size: 36px;
        color: #fff;
      }
      .icon.success { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4); }
      .icon.error   { background: linear-gradient(135deg, #f87171, #dc2626); box-shadow: 0 8px 24px rgba(220, 38, 38, 0.4); }
      .icon.warn    { background: linear-gradient(135deg, #fbbf24, #d97706); box-shadow: 0 8px 24px rgba(217, 119, 6, 0.4); }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #f8fafc;
      }
      p {
        margin: 0 0 8px;
        font-size: 16px;
        line-height: 1.6;
        color: #94a3b8;
      }
      code {
        display: inline-block;
        margin-top: 16px;
        padding: 8px 12px;
        background: rgba(148, 163, 184, 0.1);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 8px;
        font-family: "SF Mono", Monaco, Menlo, monospace;
        font-size: 13px;
        color: #cbd5e1;
      }
      .hint {
        margin-top: 24px;
        font-size: 13px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon {{variant}}">{{icon}}</div>
      <h1>{{title}}</h1>
      <p>{{message}}</p>
      {{detail}}
      <p class="hint">You can close this tab and return to your terminal.</p>
    </main>
  </body>
</html>
